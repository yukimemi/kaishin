# magi competing on this repository.
#
# **Only what is peculiar to this checkout lives here.** The roster, the seat
# assignment, the shape of a run and the update policy are already stated once
# in the machine layer (`~/.config/magi/config.toml`) — none of them are facts
# about this repository, they are facts about which agent CLIs are installed
# on this machine and what the operator is willing to spend. What is left is:
#
# - `[verify]` runs `cargo`, and points `gate` at exactly what CI runs. A
#   repository that is not Rust cannot inherit this, and the machine layer has
#   no `[verify]` at all — without it, `verify.gate` is an empty array and
#   magi's own `graph.rs` skips the gate entirely rather than failing closed,
#   which is a clean-looking `magi review` next to a red PR.
# - `[merge] base` names this repository's default branch, and has to be
#   restated here for the reason in its own comment below.
# - `[prompts]` are this project's conventions for a magi node.
#
# Note that an array may be declared in exactly one layer
# (`Config::refuse_split_arrays`), so nothing here re-declares `[[agents]]`,
# `roles.*`, `graph.*` or `update.*` — those stay machine-layer arrays/tables.
#
# Rendered by teravars. Tera braces are live everywhere in this file, but
# comments are stripped before Tera sees them, so a comment may quote
# `{{ ... }}` freely.
#
# `magi.toml` is repo-owned, not kata-managed — do not add it to `.kata/`'s
# manifest.

[vars]
# Shared build cache for the verification commands. Override per machine with
# MAGI_CACHE. Lives beside its only consumer: `[vars]` is rendered per file, so
# a value used by this file's templates is stated in this file.
cache = "{{ env.MAGI_CACHE | default(value='/tmp') }}"

[verify]
# The real-machine leg, run in the winner's worktree once per review round,
# with its output fed to the fixer.
#
# CARGO_TARGET_DIR is shared on purpose: each candidate worktree would
# otherwise compile this crate from scratch, which is by far the slowest
# thing in a run on a Rust repo. Only the winner's worktree runs these
# commands, and only one at a time, so nothing contends on cargo's lock.
# Named `kaishin-target` (not `magi-target`) so this doesn't collide with a
# concurrent magi run reviewing the magi repo itself on the same machine.
e2e = ["CARGO_TARGET_DIR={{ vars.cache }}/kaishin-target cargo test --locked --all-targets"]

# Final gate before merge. Must match the set `.github/workflows/ci.yml`
# runs, or a clean `magi review` turns into a red PR — the one failure this
# arrangement cannot absorb.
#
# `Makefile.toml`'s `[tasks.check]` advertises itself as "same as CI" and its
# `dependencies` were checked against every ci.yml job:
#   - editorconfig-check <-> the `editorconfig` job. Both Makefile.toml and
#     ci.yml carry this check, which is the right state for a human running
#     `cargo make check` by hand: CI is still the backstop, so the Makefile
#     task's own `editorconfig-check` skipping gracefully (exit 0) when
#     `editorconfig-checker` isn't on PATH costs nothing there. `verify.gate`
#     has no such backstop — it is what stands in for "will CI pass" before
#     magi merges, so the same silent skip here would let an editorconfig
#     violation through gate clean and fail CI anyway. `editorconfig-checker`
#     is therefore invoked directly below, in addition to `cargo make check`,
#     so a machine without the binary fails the gate instead of passing it.
#   - fmt-check           <-> the `fmt` job (`cargo fmt --all -- --check`).
#   - clippy              <-> the `clippy` job (`cargo clippy --all-targets --
#                              -D warnings`; the Makefile task additionally
#                              passes `--locked`, a strict superset).
#   - test                <-> the `test` job (`cargo test --all-targets`,
#                              plus `--doc` when `src/lib.rs` exists).
#   - lock-check          <-> covers both the `check` job (`cargo check
#                              --all-targets`) and the `lockfile` job (`cargo
#                              check --locked --all-targets` is a strict
#                              superset of the unlocked version, once the lock
#                              is in sync).
# That is every ci.yml job except `coverage` (cargo-llvm-cov + Codecov
# upload), which is deliberately left out of the gate: it isn't part of
# Makefile.toml's "same as CI" task either, it needs a `CODECOV_TOKEN` this
# checkout doesn't have, and `fail_ci_if_error: false` in ci.yml already means
# a bad upload doesn't fail that job — coverage is observability, not a
# correctness gate. So `cargo make check` plus the explicit editorconfig
# invocation below are the right gate commands; every entry must exit 0 for
# the gate to pass.
gate = [
  "CARGO_TARGET_DIR={{ vars.cache }}/kaishin-target cargo make check",
  "editorconfig-checker",
]

[merge]
mode = "none"
# Required here, and in every jj-colocated repo: jj keeps git's HEAD detached
# at the working-copy commit, so magi cannot infer the base branch from
# `git symbolic-ref HEAD`. This repository's default branch is `main`.
base = "main"

# Project conventions appended to the node prompts, never merged into them.
# Repository-wide context lives in AGENTS.md, which every agent already reads
# from the checkout; this is the thing a magi *node* specifically needs to
# know about how this checkout is laid out.
[prompts]
all = """
This repository uses jj (Jujutsu) with a colocated git repo. `git commit` works \
in a candidate worktree and is what magi expects, but never run `jj` commands \
and never touch the main working copy.
"""
